<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="theme-color" content="#101014">
  <title>我的 MP3 播放器</title>
  <style>
    :root{color-scheme:dark;--bg:#101014;--card:#1c1c22;--muted:#aaaab5;--line:#303039;--accent:#a8ff60;--danger:#ff7373}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#34343e 0,#15151a 42%,var(--bg) 75%);color:#f7f7f8;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 32px)}h1{font-size:30px;letter-spacing:-.04em;margin:0 0 6px}.lead{color:var(--muted);margin:0 0 24px}.card{background:rgba(28,28,34,.92);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 18px 50px #0004}.import{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--accent);color:#101014;font-weight:750;border:0;border-radius:15px;padding:15px;width:100%;cursor:pointer}input[type=file]{display:none}.note,.status{color:var(--muted);font-size:13px;margin:12px 2px 0}.status{min-height:20px}.status.busy{color:#f6d36c}.status.ok{color:var(--accent)}ol{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:9px}.track{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:9px;background:#24242b;border:1px solid transparent;border-radius:14px;padding:10px}.track.active{border-color:#7aaa50}.num{color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}.name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.size{color:var(--muted);font-size:12px}.actions{display:flex;gap:5px}.icon{width:36px;height:36px;border:0;border-radius:10px;background:#35353e;color:#fff;font-size:17px;cursor:pointer}.icon:disabled{opacity:.35}.remove{color:var(--danger)}.player{margin-top:18px;border-top:1px solid var(--line);padding-top:18px}.now{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}input[type=range]{width:100%;accent-color:var(--accent)}.controls{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px}.play{width:64px;height:64px;border:0;border-radius:50%;background:#fff;color:#111;font-size:27px;cursor:pointer}.secondary{border:0;border-radius:12px;padding:10px 13px;background:#34343d;color:#fff;cursor:pointer}.secondary:disabled,.play:disabled{opacity:.4}.empty{text-align:center;color:var(--muted);padding:28px 8px 12px}@media(max-width:430px){main{padding-left:14px;padding-right:14px}.track{grid-template-columns:28px minmax(0,1fr) auto}.icon{width:34px}}
  </style>
</head>
<body>
<main>
  <h1>我的 MP3 播放器</h1>
  <p class="lead">依清單順序播放，音檔只在這台裝置上處理。</p>
  <section class="card">
    <label class="import">＋ 匯入 MP3<input id="picker" type="file" accept="audio/mpeg,.mp3" multiple></label>
    <p class="note">可一次選多首。重新排序後，播放器會在本機重新合併音訊。</p>
    <p id="status" class="status" role="status"></p>
    <ol id="list"><li class="empty">尚未匯入歌曲</li></ol>
    <div class="player">
      <div id="now" class="now">尚未準備音訊</div>
      <input id="seek" type="range" min="0" max="1" value="0" step="0.01" disabled aria-label="播放進度">
      <div class="time"><span id="elapsed">0:00</span><span id="duration">0:00</span></div>
      <div style="display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-top:14px"><span aria-hidden="true">🔈</span><input id="volume" type="range" min="0" max="1" value="1" step="0.05" aria-label="音量"><span id="volumeValue" style="color:var(--muted);font-size:13px;min-width:38px;text-align:right">100%</span></div>
      <div class="controls"><button id="back" class="secondary" disabled>倒退 15 秒</button><button id="play" class="play" disabled aria-label="播放">▶</button><button id="forward" class="secondary" disabled>快轉 15 秒</button></div>
    </div>
  </section>
</main>
<audio id="audio" playsinline preload="metadata"></audio>
<script>
const $=s=>document.querySelector(s), picker=$('#picker'),list=$('#list'),statusEl=$('#status'),audio=$('#audio'),play=$('#play'),seek=$('#seek'),now=$('#now');
let tracks=[], mergedUrl='', boundaries=[], buildId=0;
const fmt=s=>!Number.isFinite(s)?'0:00':`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
function setStatus(text,cls=''){statusEl.textContent=text;statusEl.className='status '+cls}
function render(){list.innerHTML='';if(!tracks.length){list.innerHTML='<li class="empty">尚未匯入歌曲</li>';return}tracks.forEach((t,i)=>{const li=document.createElement('li');li.className='track';li.innerHTML=`<span class="num">${i+1}</span><span><div class="name"></div><div class="size">${(t.file.size/1048576).toFixed(1)} MB</div></span><span class="actions"><button class="icon up" aria-label="上移" ${i===0?'disabled':''}>↑</button><button class="icon down" aria-label="下移" ${i===tracks.length-1?'disabled':''}>↓</button><button class="icon remove" aria-label="移除">×</button></span>`;li.querySelector('.name').textContent=t.file.name;li.querySelector('.up').onclick=()=>move(i,-1);li.querySelector('.down').onclick=()=>move(i,1);li.querySelector('.remove').onclick=()=>remove(i);list.append(li)})}
function move(i,d){[tracks[i],tracks[i+d]]=[tracks[i+d],tracks[i]];render();build()}
function remove(i){tracks.splice(i,1);render();build()}
picker.onchange=()=>{tracks.push(...[...picker.files].map(file=>({file})));picker.value='';render();build()};
async function build(){const id=++buildId;audio.pause();play.disabled=true;seek.disabled=true;$('#back').disabled=$('#forward').disabled=true;if(mergedUrl)URL.revokeObjectURL(mergedUrl);mergedUrl='';boundaries=[];if(!tracks.length){audio.removeAttribute('src');now.textContent='尚未準備音訊';setStatus('');return}setStatus(`正在本機處理 ${tracks.length} 首 MP3…`,'busy');try{const ctx=new (window.AudioContext||window.webkitAudioContext)();const decoded=[];for(let i=0;i<tracks.length;i++){setStatus(`正在本機解碼 ${i+1} / ${tracks.length}…`,'busy');decoded.push(await ctx.decodeAudioData(await tracks[i].file.arrayBuffer()))}if(id!==buildId){await ctx.close();return}const rate=Math.max(...decoded.map(b=>b.sampleRate)),channels=Math.min(2,Math.max(...decoded.map(b=>b.numberOfChannels))),durations=decoded.map(b=>b.duration),totalFrames=Math.ceil(durations.reduce((a,b)=>a+b,0)*rate),out=ctx.createBuffer(channels,totalFrames,rate);let offset=0;boundaries=[];for(let n=0;n<decoded.length;n++){const src=decoded[n],frames=Math.round(src.duration*rate);boundaries.push({start:offset/rate,end:(offset+frames)/rate,name:tracks[n].file.name});for(let c=0;c<channels;c++){const input=src.getChannelData(Math.min(c,src.numberOfChannels-1)),target=out.getChannelData(c);for(let j=0;j<frames;j++){const pos=j*src.sampleRate/rate,lo=Math.floor(pos),hi=Math.min(lo+1,input.length-1),f=pos-lo;target[offset+j]=(input[lo]||0)*(1-f)+(input[hi]||0)*f}}offset+=frames}mergedUrl=URL.createObjectURL(encodeWav(out));audio.src=mergedUrl;await ctx.close();play.disabled=false;seek.disabled=false;$('#back').disabled=$('#forward').disabled=false;now.textContent=tracks[0].file.name;setStatus(`已完成：${tracks.length} 首已合併成單一音訊`,'ok');updateMedia()}catch(e){console.error(e);setStatus('無法合併其中一個檔案，請確認所選檔案是有效的 MP3。');now.textContent='處理失敗'}}
function encodeWav(buffer){const ch=buffer.numberOfChannels,len=buffer.length,ab=new ArrayBuffer(44+len*ch*2),v=new DataView(ab);const str=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));str(0,'RIFF');v.setUint32(4,36+len*ch*2,true);str(8,'WAVE');str(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,buffer.sampleRate,true);v.setUint32(28,buffer.sampleRate*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);str(36,'data');v.setUint32(40,len*ch*2,true);let p=44;const data=[...Array(ch)].map((_,i)=>buffer.getChannelData(i));for(let i=0;i<len;i++)for(let c=0;c<ch;c++){const s=Math.max(-1,Math.min(1,data[c][i]));v.setInt16(p,s<0?s*32768:s*32767,true);p+=2}return new Blob([ab],{type:'audio/wav'})}
play.onclick=async()=>{try{if(audio.paused)await audio.play();else audio.pause()}catch(e){setStatus('請再按一次播放以允許音訊。')}};
audio.onplay=()=>{play.textContent='❚❚';play.setAttribute('aria-label','暫停')};audio.onpause=()=>{play.textContent='▶';play.setAttribute('aria-label','播放')};
audio.ontimeupdate=()=>{seek.max=audio.duration||1;seek.value=audio.currentTime;$('#elapsed').textContent=fmt(audio.currentTime);$('#duration').textContent=fmt(audio.duration);const idx=Math.max(0,boundaries.findIndex(b=>audio.currentTime>=b.start&&audio.currentTime<b.end));[...list.children].forEach((x,i)=>x.classList.toggle('active',i===idx));if(boundaries[idx]&&now.textContent!==boundaries[idx].name){now.textContent=boundaries[idx].name;updateMedia(boundaries[idx].name)}};
seek.oninput=()=>audio.currentTime=+seek.value;$('#back').onclick=()=>audio.currentTime=Math.max(0,audio.currentTime-15);$('#forward').onclick=()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15);
const volume=$('#volume'),volumeValue=$('#volumeValue');volume.oninput=()=>{audio.volume=+volume.value;volumeValue.textContent=`${Math.round(audio.volume*100)}%`;localStorage.setItem('player-volume',audio.volume)};const savedVolume=Number(localStorage.getItem('player-volume'));if(Number.isFinite(savedVolume)&&savedVolume>=0&&savedVolume<=1){audio.volume=savedVolume;volume.value=savedVolume;volumeValue.textContent=`${Math.round(savedVolume*100)}%`}
function updateMedia(title){if('mediaSession'in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:title||'我的播放清單',artist:'本機 MP3 播放器'});for(const [action,fn] of [['play',()=>audio.play()],['pause',()=>audio.pause()],['seekbackward',()=>audio.currentTime=Math.max(0,audio.currentTime-15)],['seekforward',()=>audio.currentTime=Math.min(audio.duration||0,audio.currentTime+15)]])try{navigator.mediaSession.setActionHandler(action,fn)}catch{}}if(navigator.audioSession)try{navigator.audioSession.type='playback'}catch{}}
render();
</script>
</body>
</html>
